[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-chess-evolution"
version = "0.1.0"
description = "A self-learning chess research project"
requires-python = ">=3.10"
dependencies = [
    "python-chess>=1.999,<2",
    "torch>=2.6,<3",
]

[tool.setuptools.packages.find]
include = ["neural_chess*"]
